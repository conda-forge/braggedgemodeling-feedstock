{% set name = "braggedgemodeling" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/ornlneutronimaging/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 4843cbb5d31612bbb4f3db63515db222fa5b4f1a5402908f51792b9451b3d03d

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv"

requirements:
  build:
  host:
    - python >=3.5
    - pip
  run:
    - python >=3.5
    - pyyaml
    - numpy
    - scipy
    - matplotlib-base
    - diffpy.structure
    - periodictable

test:
  imports:
    - bem

about:
  home: https://github.com/ornlneutronimaging/braggedgemodeling
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Neutron Bragg Edge Modeling Tools
  doc_url: https://github.com/ornlneutronimaging/braggedgemodeling
  dev_url: https://github.com/ornlneutronimaging/braggedgemodeling

extra:
  recipe-maintainers:
    - yxqd
